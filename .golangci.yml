version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - gocyclo
    - gocritic
    - gosec
    - bodyclose
    - noctx
    - errname
    - errorlint
    - goconst
    - gocognit
    - godot
    - prealloc
    - predeclared

  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 30
    govet:
      enable-all: true
    revive:
      severity: warning
      enable-all-rules: false
      rules:
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: var-naming
        - name: unexported-return
        - name: time-naming
        - name: context-as-argument
        - name: context-keys-type
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - unnamedResult
        - hugeParam
        - httpNoBody
    gosec:
      excludes:
        - G404
    godot:
      scope: declarations
      capital: true

  exclusions:
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go$
        linters:
          - gocyclo
          - errcheck
          - gosec
          - gocritic
          - gocognit
          - godot
          - goconst

      # Exclude example files from certain checks
      - path: examples/
        linters:
          - errcheck
          - gosec
          - gocritic

      # Allow embedding in struct field comments
      - linters:
          - godot
        source: "// [a-z]+"

      # Ignore ineffassign for rejected variable (used for metrics/observability)
      - path: (grpc/interceptor|http/middleware)\.go$
        linters:
          - ineffassign
        text: "ineffectual assignment to rejected"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
  sort-order:
    - linter
    - severity
    - file
