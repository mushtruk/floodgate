name: Release

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Pull requests and tags created with GITHUB_TOKEN trigger no workflows, so CI would never run on the release PR.
      # A GitHub App token is minted per run, so there is no long-lived credential to rotate.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          # Release Please creates and applies its autorelease labels through the issues API.
          permission-issues: write
          permission-pull-requests: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  tag-submodules:
    name: Tag Submodules
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      dirs: ${{ steps.discover.outputs.dirs }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      # Every module outside the root and examples/ is a library released in lockstep with the root.
      - name: Discover library submodules
        id: discover
        run: echo "dirs=$(git ls-files '*go.mod' ':!:go.mod' ':!:examples/**' | xargs -n1 dirname | jq -Rcs 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

      # Go resolves a submodule version only from a tag prefixed with the submodule's directory.
      - name: Push submodule tags
        env:
          DIRS: ${{ steps.discover.outputs.dirs }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          refs=()
          for dir in $(jq -r '.[]' <<<"$DIRS"); do
            git tag "$dir/$TAG" "$SHA"
            refs+=("refs/tags/$dir/$TAG")
          done
          git push origin "${refs[@]}"

  verify-install:
    name: Verify Install (${{ matrix.dir }})
    needs: [release-please, tag-submodules]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.tag-submodules.outputs.dirs) }}
        include:
          - dir: .
    steps:
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24'
          cache: false

      # GOPRIVATE bypasses the public proxy and checksum database, which may not have seen the new tags yet.
      - name: Install and build from a fresh module
        env:
          GOPRIVATE: github.com/mushtruk/floodgate
          DIR: ${{ matrix.dir }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          module=github.com/mushtruk/floodgate
          if [ "$DIR" != . ]; then module="$module/$DIR"; fi
          cd "$(mktemp -d)"
          go mod init install-check
          go get "$module/...@$TAG"
          go build "$module/..."
